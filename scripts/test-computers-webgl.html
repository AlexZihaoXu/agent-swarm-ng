<!doctype html>
<meta charset="utf-8"><title>Disposable WebGL proof</title>
<canvas id="demo" width="512" height="512"></canvas>
<output id="result">pending</output>
<script>
// Self-contained, deterministic WebGL demo for a test-owned Linux computer.
// No external content, browser-security bypass, or access to host/dev tools.
const report = document.getElementById('result');
try {
  const gl = document.getElementById('demo').getContext('webgl', { preserveDrawingBuffer: true });
  if (!gl) throw Error('No WebGL context');
  const shader = (type, source) => {
    const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(s));
    return s;
  };
  const program = gl.createProgram();
  gl.attachShader(program, shader(gl.VERTEX_SHADER, 'attribute vec2 pos; void main() { gl_Position = vec4(pos, 0.0, 1.0); }'));
  gl.attachShader(program, shader(gl.FRAGMENT_SHADER, 'precision mediump float; void main() { gl_FragColor = vec4(0.1, 0.9, 0.3, 1.0); }'));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,0,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(program, 'pos'); gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  gl.viewport(0,0,512,512); gl.clearColor(0.12,0.12,0.12,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES,0,3);
  const pixel = new Uint8Array(4); gl.readPixels(256,256,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
  const ext=gl.getExtension('WEBGL_debug_renderer_info');
  const renderer=ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  const hardware=/AMD.*Radeon|Radeon.*AMD/i.test(renderer) && !/swiftshader|llvmpipe/i.test(renderer);
  const ok=hardware&&pixel[0]<80&&pixel[1]>180&&pixel[2]>40&&pixel[2]<150&&pixel[3]===255;
  // Make the live JPEG viewer proof depend on an actual AMD browser context,
  // rather than accidentally passing when Chrome silently uses SwiftShader.
  document.getElementById('demo').style.visibility=hardware?'visible':'hidden';
  report.textContent=JSON.stringify({ok,pixel:[...pixel],renderer,version:gl.getParameter(gl.VERSION),webgl2:!!document.createElement('canvas').getContext('webgl2')});
} catch(error) { report.textContent=JSON.stringify({ok:false,error:String(error)}); }
</script>
