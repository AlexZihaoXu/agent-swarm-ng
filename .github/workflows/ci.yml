name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.scratch/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run api:check
      - run: bun run typecheck
      - run: bun run test
      - name: Guest computer protocol and file tests
        run: mkdir -p .scratch && TMPDIR="$PWD/.scratch" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s templates/default/runtime -p 'test_computer*.py'
      - run: bun run build
      - run: bun x playwright install --with-deps chromium
        working-directory: frontend
      - run: bun run test:e2e
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Every supported deployment stack is valid
        env:
          TAILSCALE_IP: 100.64.0.1
          TAILSCALE_DNS_NAME: host.example.ts.net
          LAN_IP: 192.168.0.10
        run: |
          for stack in $(sh scripts/compose.sh --list | awk '/^(local|dev|lan-http|tailnet-[a-z0-9]+) /{print $1}'); do
            echo "== $stack"; sh scripts/compose.sh "$stack" config --quiet
          done
