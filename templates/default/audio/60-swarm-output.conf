# Computers have no sound card. A virtual output always exists so browsers and other
# apps can open audio (without one, Chrome's media pipeline stalls before the first
# video frame). The dashboard can stream this output's monitor to the viewer.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "swarm-output"
            node.description = "Virtual speakers"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            priority.session = 2000
        }
    }
]
