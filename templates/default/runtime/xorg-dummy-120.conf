# Opt-in virtual 1920x1080@120 mode. No physical scanout, GPU card node or TCP X11.
Section "ServerLayout"
  Identifier "Synthetic120"
  Screen 0 "SyntheticScreen" 0 0
EndSection
Section "Device"
  Identifier "DummyDevice"
  Driver "dummy"
  VideoRam 256000
EndSection
Section "Monitor"
  Identifier "DummyMonitor"
  # Reject all built-in 60/75/85-Hz modes. Keep one fixed 1920x1080@120
  # output instead of letting the guest/browser select another resolution.
  HorizSync 136.0 - 139.0
  VertRefresh 119.0 - 121.0
  Option "ReducedBlanking" "true"
  # 285.5424 MHz / (2080 * 1144) = exactly 120.000 Hz nominal.
  Modeline "1920x1080_120" 285.5424 1920 1968 2000 2080 1080 1083 1088 1144 +HSync -VSync
  Option "PreferredMode" "1920x1080_120"
EndSection
Section "Screen"
  Identifier "SyntheticScreen"
  Device "DummyDevice"
  Monitor "DummyMonitor"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "1920x1080_120"
    Virtual 1920 1080
  EndSubSection
EndSection
