# Opt-in self-signed HTTPS dashboard listener on Tailnet TCP 19091, beside the
# existing HTTP dashboard on 19090. Combine AFTER compose.yaml +
# compose.tailscale.yaml + compose.tailscale-http-jpeg.yaml +
# compose.tailscale-http-jpeg-x11.yaml + compose.tailscale-http-jpeg-xorg120.yaml.
#
# Why: browsers only expose WebCodecs on a secure context, so the HTTP origin
# can never use H.264/H.265. Port 19091 serves the same app over a deliberately
# untrusted self-signed certificate (provision by scripts/make-self-signed-cert.sh);
# the operator accepts the browser warning once. Tailscale already encrypts the
# transport, so this adds a browser capability, not confidentiality.
#
# Computer image: the AV1-default desktop. The guest launcher now defaults to
# `--encoder=av1enc` with CRF 20 / paint-over CRF 18 / burst 2, and publishes the
# full encoder menu, so each origin negotiates its own: the secure viewer keeps
# AV1 (software SVT-AV1 on this host; the GPU encodes H.264/HEVC only), while the
# insecure HTTP viewer now *requests* JPEG stripes because the reviewed client
# patch transmits an insecure-origin preference too. The previous JPEG-pinned
# image stays tagged as `agent-swarm-default:jpeg-fallback-20260926`.
# Two fixes make one JPEG-default image serve both origins: the guest launcher
# publishes the operator encoder plus the full upstream menu (a bare
# `--encoder=jpeg` publishes a one-item allowed list that blocks every client
# switch), and the reviewed client patch transmits the secure origin's H.264
# request through upstream's own codec ladder. Measured on one throwaway
# computer: HTTP stays `Mode: JPEG` and renders; HTTPS switches the guest to
# `Encoder: VAAPI | Mode: H264 | VBV: 8000 kbps`. The h264-xorg120 build below
# stays available as an explicit H.264-default alternative.
services:
  frontend:
    environment:
      SITE_ADDRESS_HTTPS: ":19091"
    ports: !override
      - "127.0.0.1:19090:19090"
      - "${TAILSCALE_IP:?Set TAILSCALE_IP to this machine's Tailscale IPv4 address}:19090:19090"
      - "127.0.0.1:19091:19091"
      - "${TAILSCALE_IP:?Set TAILSCALE_IP to this machine's Tailscale IPv4 address}:19091:19091"
    volumes:
      - ./frontend/Caddyfile.tailnet-dual:/etc/caddy/Caddyfile:ro
      - ./.local/certs/dashboard-selfsigned.crt:/etc/caddy/dashboard-selfsigned.crt:ro
      - ./.local/certs/dashboard-selfsigned.key:/etc/caddy/dashboard-selfsigned.key:ro
  computer-av1-xorg120-image:
    profiles: [computer-images]
    image: agent-swarm-default:av1-xorg120
    build:
      context: .
      dockerfile: templates/default/xorg120.Dockerfile
      args:
        COMPUTER_X11_BASE: agent-swarm-default:av1-x11
    command: ["true"]
  computer-controller:
    environment:
      COMPUTER_IMAGE: agent-swarm-default:av1-xorg120
