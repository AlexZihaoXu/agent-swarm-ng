name: agent-swarm-v2
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-file:/app/.local/platform.db}
    init: true
    volumes:
      - platform_data:/app/.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/api/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  platform_data:
  caddy_data:
  caddy_config:
