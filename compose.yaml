name: agent-swarm-ng
# Bounded container logs (Docker keeps them forever otherwise): at most 5 × 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-file:/app/.local/platform.db}
      AGENT_RUN_TIMEOUT_MS: ${AGENT_RUN_TIMEOUT_MS:-0}
      # Host names (besides IP addresses and localhost) allowed to reach the API; blocks DNS rebinding.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      # Days of operator activity to keep (0 keeps everything).
      ACTIVITY_RETENTION_DAYS: ${ACTIVITY_RETENTION_DAYS:-30}
      # Daily database copies kept in .local/backups/database (0 turns them off).
      DATABASE_BACKUPS: ${DATABASE_BACKUPS:-7}
      # Required shared secret for the internal computer controller.
      COMPUTER_CONTROLLER_TOKEN: ${COMPUTER_CONTROLLER_TOKEN:?Set COMPUTER_CONTROLLER_TOKEN in .env (openssl rand -hex 32)}
      COMPUTER_CONTROLLER_URL: http://computer-controller:3101
    init: true
    volumes:
      - platform_data:/app/.local
      # The host's network counters, from host-net (the backend's own /proc/net/dev is its container's).
      - host_net:/app/host-net:ro
    restart: unless-stopped
    logging: *logging
    networks:
      - default
      - computer_management
    depends_on:
      computer-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/api/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
  # Copies the host's physical network interface counters (stamped with the host's uptime) once a second into a shared
  # in-memory volume for the Dashboard (docs/dashboard.md). Host network namespace only: no privileges, no ports,
  # read-only, as nobody.
  host-net:
    # Pinned by digest: it shares the host's network namespace.
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    network_mode: host
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - host_net:/out
    command:
      - sh
      - -c
      - >-
        while :; do
        { cut -d' ' -f1 /proc/uptime; for d in /sys/class/net/*; do [ -e "$$d/device" ] && echo "$${d##*/}"; done; echo ---; cat /proc/net/dev; }
        > /out/net.tmp && mv /out/net.tmp /out/net;
        sleep 1;
        done
    restart: unless-stopped
    logging: *logging
  computer-image:
    profiles: [computer-images]
    image: agent-swarm-default:stage2
    build:
      context: ./templates/default
    command: ["true"]
  computer-egress-image:
    profiles: [computer-images]
    image: agent-swarm-computer-egress:dev
    build:
      context: ./templates/default
      dockerfile: egress.Dockerfile
    command: ["true"]
  computer-media-image:
    profiles: [computer-images]
    image: agent-swarm-computer-media:stage2
    build:
      context: ./templates/default
      dockerfile: media.Dockerfile
    command: ["true"]
  computer-controller:
    build:
      context: .
      dockerfile: computer-controller/Dockerfile
    environment:
      COMPUTER_NAMESPACE: ${COMPUTER_NAMESPACE:-agent-swarm-ng}
      # Required: without it the controller answers only its health check.
      COMPUTER_CONTROLLER_TOKEN: ${COMPUTER_CONTROLLER_TOKEN:?Set COMPUTER_CONTROLLER_TOKEN in .env (openssl rand -hex 32)}
      # Opt-in: shares ONLY this DRM render node with each sudo computer.
      COMPUTER_RENDER_DEVICE: ${COMPUTER_RENDER_DEVICE:-}
      COMPUTER_CPU_LIMIT: ${COMPUTER_CPU_LIMIT:-2}
      # Operator-chosen IANA zone for each guest clock (for example
      # America/Toronto). Empty inherits the image default (UTC). Existing
      # computers keep the zone they were created with until they are recreated.
      COMPUTER_TIMEZONE: ${COMPUTER_TIMEZONE:-}
      # Extra host paths for the dashboard's disk chart (comma-separated, absolute), measured read-only.
      DASHBOARD_EXTRA_DISKS: ${DASHBOARD_EXTRA_DISKS:-}
    init: true
    # Only this narrow internal service has the root-equivalent Docker socket.
    # It has no app database, provider credentials, or published ports.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - computer_management
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3101/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        COMPUTER_VIEWER: ${COMPUTER_VIEWER:-on}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      # Addresses whose forwarded client address Caddy believes (docs/login.md); default: private and tailnet ranges.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges 100.64.0.0/10}
    networks:
      - default
      - computer_media
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    # Caddy's admin API answers on loopback inside the container while Caddy runs.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
networks:
  computer_management:
    internal: true
  # Caddy is the only application service on this bridge. Per-computer media
  # relays attach here and to exactly one private bridge, but have no host port.
  computer_media:
    name: ${COMPUTER_NAMESPACE:-agent-swarm-ng}-computer-media
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
volumes:
  platform_data:
  # In memory: written every second, never worth a disk write.
  host_net:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=65534,gid=65534,mode=0755"
  caddy_data:
  caddy_config:
