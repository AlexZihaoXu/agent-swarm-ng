name: agent-swarm-ng
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-file:/app/.local/platform.db}
      AGENT_RUN_TIMEOUT_MS: ${AGENT_RUN_TIMEOUT_MS:-0}
      COMPUTER_CONTROLLER_URL: http://computer-controller:3101
    init: true
    volumes:
      - platform_data:/app/.local
    restart: unless-stopped
    networks:
      - default
      - computer_management
    depends_on:
      computer-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/api/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
  computer-image:
    profiles: [computer-images]
    image: agent-swarm-default:stage2
    build:
      context: ./templates/default
    command: ["true"]
  computer-egress-image:
    profiles: [computer-images]
    image: agent-swarm-computer-egress:dev
    build:
      context: ./templates/default
      dockerfile: egress.Dockerfile
    command: ["true"]
  computer-controller:
    build:
      context: .
      dockerfile: computer-controller/Dockerfile
    environment:
      COMPUTER_NAMESPACE: ${COMPUTER_NAMESPACE:-agent-swarm-ng}
    init: true
    # Only this narrow internal service has the root-equivalent Docker socket.
    # It has no app database, provider credentials, or published ports.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - computer_management
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3101/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
networks:
  computer_management:
    internal: true
volumes:
  platform_data:
  caddy_data:
  caddy_config:
